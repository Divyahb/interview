<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📘 Divya’s Productivity Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts & Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- App Script -->
    <script src="./scripts/timeline.js"></script>
    <script src="./scripts/routes.js"></script>
    <script src="./scripts/fragmentRegistry.js"></script>
    <script src="./scripts/scripts.js" defer></script>
  </head>
  <body
    class="bg-gray-50 min-h-screen dark:bg-gray-900 transition-colors duration-200 font-roboto"
  >
    <aside id="sidebar" class="w-64 bg-white border-r shadow-sm p-4">
      <nav class="space-y-2 text-md font-medium text-gray-800" id="menu">
        <!-- Home -->
        <a
          href="#dashboard"
          data-fragment="dashboard"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fas fa-home text-blue-600 text-base w-5"></i>
          <span>Home</span>
        </a>

        <!-- AWS -->
        <a
          href="#aws"
          data-fragment="aws"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fab fa-aws text-yellow-500 text-base w-5"></i>
          <span>AWS Certification</span>
        </a>

        <!-- Coding -->
        <a
          href="#challenges"
          data-fragment="challenges"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fas fa-code text-blue-500 text-base w-5"></i>
          <span>Coding</span>
        </a>

        <!-- Resume + GitHub -->
        <a
          href="#branding"
          data-fragment="branding"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fas fa-id-badge text-green-500 text-base w-5"></i>
          <span>Resume + GitHub</span>
        </a>

        <!-- German -->
        <a
          href="#german"
          data-fragment="german"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fas fa-language text-pink-500 text-base w-5"> </i>
          <span>German Language</span>
        </a>

        <!-- System Design -->
        <a
          href="#system_design"
          data-fragment="system_design"
          class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-100 transition"
        >
          <i class="fas fa-network-wired text-purple-500 text-base w-5"></i>
          <span>System Design</span>
        </a>
      </nav>
    </aside>
    <!-- Main Content -->
    <main id="content" class="p-6"></main>
  </body>
</html>

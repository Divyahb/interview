<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Developer Coding Challenges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
        .challenge-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .challenge-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-left-color: #0ea5e9;
        }

        .solution-toggle {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .solution-toggle.active {
            max-height: 2000px;
        }

        .checklist-item input:checked+label {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .checklist-item input:checked+label .checkmark {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }

        .checklist-item input:checked+label .checkmark:after {
            display: block;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .difficulty-easy {
            background-color: #ecfdf5;
            color: #059669;
        }

        .difficulty-medium {
            background-color: #fef3c7;
            color: #d97706;
        }

        .difficulty-hard {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .tag {
            transition: all 0.2s ease;
        }

        .tag:hover {
            transform: translateY(-1px);
        }

        .progress-bar {
            height: 6px;
            transition: width 0.6s ease;
        }

        .sidebar {
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb #f3f4f6;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f3f4f6;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 6px;
        }

        .dark .sidebar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .dark .sidebar::-webkit-scrollbar-thumb {
            background-color: #4b5563;
        }

        .dark .challenge-card {
            background-color: #1f2937;
            border-color: #374151;
        }

        .dark .challenge-card:hover {
            border-left-color: #0ea5e9;
        }

        .dark .solution-content {
            background-color: #111827;
        }

        .dark .checklist-container {
            background-color: #1f2937;
            border-color: #374151;
        }

        .dark .checklist-item input:checked+label {
            color: #9ca3af;
        }

        .dark .checklist-item label {
            color: #e5e7eb;
        }

        .dark .checkmark {
            border-color: #4b5563;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 transition-colors duration-200">
    <aside id="sidebar">
    <h2><a href="index.html">🏠 Home</a></h2>
        <h2>🗂️ Focus Areas</h2>
        <ul style="list-style:none; padding:0;">
            <li><a href="aws.html">AWS Certification</a></li>
            <li><a href="challenges.html">Coding & System Design</a></li>
            <li><a href="branding.html">Resume + GitHub</a></li>
            <li><a href="german.html"><strong>German Language</strong></a></li>
        </ul>
  </aside>
  <main>
    <div class="container mx-auto px-12 py-8">
        <!-- Header with theme toggle -->
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white mb-2">Senior Developer
                        Coding Challenges</h1>
                    <p class="text-lg text-gray-600 dark:text-gray-300">Top problems asked by German tech companies</p>
                </div>
                <button id="theme-toggle"
                    class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:inline"></i>
                </button>
            </div>

            <div class="mt-6 flex flex-wrap gap-2 justify-center">
                <span
                    class="px-4 py-2 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fab fa-js mr-2"></i> JavaScript
                </span>
                <span
                    class="px-4 py-2 bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-project-diagram mr-2"></i> Algorithms
                </span>
                <span
                    class="px-4 py-2 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-server mr-2"></i> System Design
                </span>
                <span
                    class="px-4 py-2 bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-users mr-2"></i> Concurrency
                </span>
            </div>

            <!-- Progress bar -->
            <div class="mt-8 bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                <div class="progress-bar bg-blue-600 dark:bg-blue-500 rounded-full h-2.5" style="width: 12%"></div>
            </div>
            <div class="mt-2 text-sm text-gray-600 dark:text-gray-400 flex justify-between">
                <span></span>
                <span></span>
            </div>

            <button id="view-bookmarked"
                class="px-3 py-1 bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 rounded-lg text-sm font-medium flex items-center gap-2"
                title="View Bookmarked">
                <i class="fas fa-bookmark"></i> Bookmarked
            </button>
        </header>

        <div class="flex flex-col lg:flex-row gap-4">

            <!-- Main content -->
            <div class="w-full ">
                <!-- Search and filter -->
                <!-- Update the search-filter container to enable searching for categories -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 mb-6" id="search-filter">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400"></i>
                            </div>
                            <input type="text" id="title-search"
                                class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Search titles...">
                        </div>
                        <!-- Replace the category-select with a typed search dropdown using datalist -->
                        <div class="flex gap-2">
                            <input list="category-list" id="category-search"
                                class="border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Search or select category...">

                            <button id="clear-category-search" type="button"
                                class="right-2 top-1/2 text-gray-400 hover:text-red-500"
                                style="background: none; border: none; padding: 0; cursor: pointer;">
                                <i class="fas fa-times"></i>
                            </button> <datalist id="category-list">
                                <option value="Arrays">
                                <option value="Strings">
                                <option value="Trees">
                                <option value="Graphs">
                                <option value="HashMap">
                                <option value="Linked List">
                                <option value="Sliding Window">
                                <option value="Binary Search">
                                <option value="Expand Around Center">
                                <option value="Deque">
                                <option value="Two Pointers">
                                <option value="Stack">
                                <option value="Dynamic Programming">
                                <option value="Backtracking">
                                <option value="Heap">
                                <option value="Matrix">
                                <option value="System Design">
                                <option value="Javascript">
                                <option value="Design">
                                <option value="Intervals">
                                <option value="Prefix Sum">
                                <option value="Recursion">
                                <option value="DFS">
                                <option value="BFS">
                                <option value="Trie">
                                <option value="Knapsack">
                                <option value="Simulation">
                                <option value="Voting Algorithm">
                                <option value="Center Expansion">
                                <option value="Greedy">
                                <option value="In-Place">
                                <option value="Preprocessing">
                                <option value="Optimization">
                                <option value="Timer">
                                <option value="Validation">
                                <option value="Bit Manipulation">
                                    <!-- Add more tags if new ones are introduced in your challenge data -->
                            </datalist>
                            <select id="difficulty-select"
                                class="border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="All">All Difficulties</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Challenges container -->
                <div id="challenges-container" class="space-y-6">
                </div>

            </div>
        </div>
    </div>
</main>
    <script src="challenges.js"></script>
</body>

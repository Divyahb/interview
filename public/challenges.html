<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Developer Coding Challenges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .challenge-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .challenge-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-left-color: #0ea5e9;
        }
        .solution-toggle {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .solution-toggle.active {
            max-height: 2000px;
        }
        .checklist-item input:checked + label {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .checklist-item input:checked + label .checkmark {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }
        .checklist-item input:checked + label .checkmark:after {
            display: block;
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .difficulty-easy {
            background-color: #ecfdf5;
            color: #059669;
        }
        .difficulty-medium {
            background-color: #fef3c7;
            color: #d97706;
        }
        .difficulty-hard {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        .tag {
            transition: all 0.2s ease;
        }
        .tag:hover {
            transform: translateY(-1px);
        }
        .progress-bar {
            height: 6px;
            transition: width 0.6s ease;
        }
        .sidebar {
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb #f3f4f6;
        }
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f3f4f6;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 6px;
        }
        .dark .sidebar::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .dark .sidebar::-webkit-scrollbar-thumb {
            background-color: #4b5563;
        }
        .dark .challenge-card {
            background-color: #1f2937;
            border-color: #374151;
        }
        .dark .challenge-card:hover {
            border-left-color: #0ea5e9;
        }
        .dark .solution-content {
            background-color: #111827;
        }
        .dark .checklist-container {
            background-color: #1f2937;
            border-color: #374151;
        }
        .dark .checklist-item input:checked + label {
            color: #9ca3af;
        }
        .dark .checklist-item label {
            color: #e5e7eb;
        }
        .dark .checkmark {
            border-color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen dark:bg-gray-900 transition-colors duration-200">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with theme toggle -->
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white mb-2">Senior Developer Coding Challenges</h1>
                    <p class="text-lg text-gray-600 dark:text-gray-300">Top problems asked by German tech companies</p>
                </div>
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:inline"></i>
                </button>
            </div>
            
            <div class="mt-6 flex flex-wrap gap-2 justify-center">
                <span class="px-4 py-2 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fab fa-js mr-2"></i> JavaScript
                </span>
                <span class="px-4 py-2 bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-project-diagram mr-2"></i> Algorithms
                </span>
                <span class="px-4 py-2 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-server mr-2"></i> System Design
                </span>
                <span class="px-4 py-2 bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 rounded-full text-sm font-medium flex items-center">
                    <i class="fas fa-users mr-2"></i> Concurrency
                </span>
            </div>
            
            <!-- Progress bar -->
            <div class="mt-8 bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                <div class="progress-bar bg-blue-600 dark:bg-blue-500 rounded-full h-2.5" style="width: 12%"></div>
            </div>
            <div class="mt-2 text-sm text-gray-600 dark:text-gray-400 flex justify-between">
                <span>12% completed</span>
                <span>12/100 challenges solved</span>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Sidebar - Checklist -->
            <div class="w-full lg:w-1/4">
                <div class="checklist-container bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md sticky top-4 h-[calc(100vh-2rem)] overflow-y-auto sidebar">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-800 dark:text-white">Study Plan</h2>
                        <button class="text-sm text-blue-600 dark:text-blue-400 hover:underline">Reset</button>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="checklist-item">
                            <input type="checkbox" id="check-all" class="hidden">
                            <label for="check-all" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="font-medium text-gray-800 dark:text-gray-200">Select All</span>
                            </label>
                        </div>
                        
                        <div class="border-t border-gray-200 dark:border-gray-700 my-3"></div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-1" class="hidden">
                            <label for="check-1" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">Array Problems</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">3/20</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 15%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-2" class="hidden">
                            <label for="check-2" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">String Problems</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">2/15</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 13%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-3" class="hidden">
                            <label for="check-3" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">Tree Problems</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">0/12</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-4" class="hidden">
                            <label for="check-4" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">Graph Problems</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">0/10</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-5" class="hidden">
                            <label for="check-5" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">Dynamic Programming</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">1/8</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 12.5%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-6" class="hidden">
                            <label for="check-6" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">System Design</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">4/15</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 27%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-7" class="hidden">
                            <label for="check-7" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">Concurrency</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">2/10</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 20%"></div>
                            </div>
                        </div>
                        
                        <div class="checklist-item">
                            <input type="checkbox" id="check-8" class="hidden">
                            <label for="check-8" class="flex items-center cursor-pointer select-none">
                                <span class="checkmark w-5 h-5 inline-block mr-3 border rounded border-gray-400 relative"></span>
                                <span class="text-gray-800 dark:text-gray-200">JavaScript Specific</span>
                                <span class="ml-auto text-sm text-gray-500 dark:text-gray-400">0/10</span>
                            </label>
                            <div class="mt-1 ml-8 h-1 bg-gray-200 dark:bg-gray-700 rounded-full">
                                <div class="h-1 bg-blue-600 dark:bg-blue-500 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-8">
                        <h3 class="text-lg font-medium text-gray-800 dark:text-white mb-3">Companies</h3>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">Zalando</span>
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">HelloFresh</span>
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">GetYourGuide</span>
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">Booking.com</span>
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">Delivery Hero</span>
                            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-xs">Auto1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <div class="w-full lg:w-3/4">
                <!-- Search and filter -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 mb-6">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400"></i>
                            </div>
                            <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Search challenges...">
                        </div>
                        <div class="flex gap-2">
                            <select class="border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option>All Categories</option>
                                <option>Arrays</option>
                                <option>Strings</option>
                                <option>Trees</option>
                                <option>Graphs</option>
                            </select>
                            <select class="border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option>All Difficulties</option>
                                <option>Easy</option>
                                <option>Medium</option>
                                <option>Hard</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Challenges container -->
                <div id="challenges-container" class="space-y-6">
                </div>
                
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle solution visibility
            const toggleButtons = document.querySelectorAll('.solution-toggle-btn');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const solution = this.parentElement.nextElementSibling;
                    solution.classList.toggle('active');
                    
                    const icon = this.querySelector('i');
                    if (solution.classList.contains('active')) {
                        icon.classList.remove('fa-chevron-down');
                        icon.classList.add('fa-chevron-up');
                        this.querySelector('span').textContent = 'Hide Solution';
                    } else {
                        icon.classList.remove('fa-chevron-up');
                        icon.classList.add('fa-chevron-down');
                        this.querySelector('span').textContent = 'View Solution';
                    }
                });
            });

            // Checklist functionality
            const checkAll = document.getElementById('check-all');
            const checkboxes = document.querySelectorAll('.checklist-item input:not(#check-all)');
            
            checkAll.addEventListener('change', function() {
                checkboxes.forEach(checkbox => {
                    checkbox.checked = this.checked;
                    const label = checkbox.nextElementSibling;
                    if (this.checked) {
                        label.style.textDecoration = 'line-through';
                        label.style.color = '#9ca3af';
                    } else {
                        label.style.textDecoration = 'none';
                        label.style.color = '';
                    }
                });
            });

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const label = this.nextElementSibling;
                    if (this.checked) {
                        label.style.textDecoration = 'line-through';
                        label.style.color = '#9ca3af';
                    } else {
                        label.style.textDecoration = 'none';
                        label.style.color = '';
                    }
                    
                    // Update "Select All" checkbox
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    checkAll.checked = allChecked;
                });
            });

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            
            // Check for saved theme preference or use system preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.classList.add(savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.classList.add('dark');
            }
            
            themeToggle.addEventListener('click', function() {
                html.classList.toggle('dark');
                const theme = html.classList.contains('dark') ? 'dark' : '';
                localStorage.setItem('theme', theme);
            });
            
            // Update progress bars based on completion
            function updateProgressBars() {
                const progressBars = document.querySelectorAll('.checklist-item .bg-blue-600');
                progressBars.forEach(bar => {
                    const parent = bar.parentElement;
                    const text = parent.previousElementSibling.querySelector('span:last-child').textContent;
                    const [completed, total] = text.split('/').map(Number);
                    const percentage = (completed / total) * 100;
                    bar.style.width = `${percentage}%`;
                });
            }
            
            updateProgressBars();
        });
        fetch('/output.html')
    .then(res => res.text())
    .then(html => document.getElementById('challenges-container').innerHTML = html);
    </script>
</body>
</html>

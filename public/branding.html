<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Branding Study Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .checklist-section {
            margin-bottom: 2rem;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .checklist-item label {
            margin-left: 0.5rem;
            cursor: pointer;
        }

        .progress-bar-bg {
            background: #e5e7eb;
            border-radius: 9999px;
            height: 1rem;
            width: 100%;
        }

        .progress-bar {
            background: #2563eb;
            border-radius: 9999px;
            height: 1rem;
            transition: width 0.3s;
        }

        .dark .progress-bar-bg {
            background: #374151;
        }

        .dark .progress-bar {
            background: #60a5fa;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 transition-colors duration-200">
    <aside id="sidebar"
        style="width:220px; float:left; background:#fff; padding:2rem 1rem; min-height:100vh; border-right:1px solid #e5e7eb;">
        <h2><a href="index.html">🏠 Home</a></h2>
        <h2>🗂️ Focus Areas</h2>
        <ul style="list-style:none; padding:0;">
            <li><a href="aws.html">AWS Certification</a></li>
            <li><a href="challenges.html">Coding & System Design</a></li>
            <li><strong><a href="branding.html">Resume + GitHub</a></strong></li>
            <li><a href="german.html">German Language</a></li>
        </ul>
    </aside>
    <main style="margin-left:240px;">
        <div class="container mx-auto px-12 py-8">
            <header class="mb-8">
                <h1 class="text-2xl font-bold mb-2">Branding Progress</h1>
                <div class="progress-bar-bg">
                    <div id="branding-progress-bar" class="progress-bar" style="width:0%"></div>
                </div>
                <div class="mt-2 flex justify-between items-center">
                    <span id="branding-progress-text">0% completed</span>
                    <span id="branding-progress-count">0/10 action items completed</span>
                </div>
            </header>
            <section>
                <h2 class="text-xl font-semibold mb-4">Checklist</h2>
                <div id="branding-checklist-container">
                    <!-- Checklist sections will be rendered here -->
                </div>
            </section>
        </div>
    </main>
    <script>
        // Replace brandingChecklistData with the updated version:
        const brandingChecklistData = [
            {
                section: "LinkedIn Branding",
                items: [
                    { title: "Update profile photo", link: "https://www.linkedin.com/help/linkedin/answer/71/change-your-profile-photo" },
                    { title: "Write a compelling headline", link: "https://www.linkedin.com/help/linkedin/answer/1128/edit-your-headline" },
                    { title: "Craft a strong summary/about section", link: "https://www.linkedin.com/help/linkedin/answer/46644/edit-your-summary" },
                    { title: "Add relevant skills", link: "https://www.linkedin.com/help/linkedin/answer/1197/add-or-remove-skills" },
                    { title: "Request recommendations", link: "https://www.linkedin.com/help/linkedin/answer/96/request-a-recommendation" },
                    { title: "Create a good resume", link: "https://www.linkedin.com/help/linkedin/answer/111/edit-your-resume" },
                    { title: "Update profile in German", link: "https://www.linkedin.com/help/linkedin/answer/2974/add-a-profile-in-another-language" },
                    { title: "Post twice every week in LinkedIn", link: "https://www.linkedin.com/help/linkedin/answer/2974/add-a-profile-in-another-language" }
                ]
            },
            {
                section: "GitHub Profile",
                items: [
                    { title: "Create a professional profile README", link: "https://docs.github.com/en/github/setting-up-and-managing-your-github-profile/customizing-your-profile/about-your-profile" },
                    { title: "Pin top repositories", link: "https://docs.github.com/en/github/setting-up-and-managing-your-github-profile/pinning-repositories-to-your-profile" },
                    { title: "Add a profile photo and bio", link: "https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-github-profile/customizing-your-profile" },
                    { title: "Showcase projects with good READMEs", link: "https://docs.github.com/en/github/creating-cloning-and-archiving-repositories/about-readmes" },
                    { title: "Enable GitHub Sponsors or add contact info", link: "https://docs.github.com/en/sponsors/getting-paid-through-github-sponsors/about-github-sponsors-for-individuals" },
                    { title: "Complete Project 1: Resume/Website Generator with AI", link: "https://github.com/topics/ai-resume-generator" },
                    { title: "Complete Project 2: Build a configurable planner hub", link: "https://github.com/topics/productivity-planner" }
                ]
            }
        ];

        function renderBrandingChecklist() {
            const container = document.getElementById('branding-checklist-container');
            container.innerHTML = '';
            brandingChecklistData.forEach((section, sIdx) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'checklist-section';

                const heading = document.createElement('h3');
                heading.className = 'text-lg font-semibold mb-2';
                heading.textContent = section.section;
                sectionDiv.appendChild(heading);

                section.items.forEach((item, iIdx) => {
                    const itemId = `branding-${sIdx}-${iIdx}`;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'checklist-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = itemId;
                    checkbox.setAttribute('data-item', itemId);

                    const label = document.createElement('label');
                    label.htmlFor = itemId;

                    const link = document.createElement('a');
                    link.href = item.link;
                    link.target = '_blank';
                    link.textContent = item.title;

                    label.appendChild(link);
                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    sectionDiv.appendChild(itemDiv);
                });

                container.appendChild(sectionDiv);
            });
        }

        function updateBrandingProgress() {
            const total = 15;
            let completed = 0;
            brandingChecklistData.forEach((section, sIdx) => {
                section.items.forEach((item, iIdx) => {
                    const itemId = `branding-${sIdx}-${iIdx}`;
                    if (localStorage.getItem(itemId) === 'true') completed++;
                });
            });
            const percent = Math.round((completed / total) * 100);
            document.getElementById('branding-progress-bar').style.width = percent + '%';
            document.getElementById('branding-progress-text').textContent = `${percent}% completed`;
            document.getElementById('branding-progress-count').textContent = `${completed}/${total} action items completed`;
            localStorage.setItem('branding-overall-percent', percent);
        }

        function initializeBrandingChecklist() {
            renderBrandingChecklist();
            brandingChecklistData.forEach((section, sIdx) => {
                section.items.forEach((item, iIdx) => {
                    const itemId = `branding-${sIdx}-${iIdx}`;
                    const checkbox = document.getElementById(itemId);
                    if (localStorage.getItem(itemId) === 'true') {
                        checkbox.checked = true;
                    }
                    checkbox.addEventListener('change', function () {
                        localStorage.setItem(itemId, this.checked ? 'true' : 'false');
                        updateBrandingProgress();
                    });
                });
            });
            updateBrandingProgress();
        }

        document.addEventListener('DOMContentLoaded', initializeBrandingChecklist);
    </script>
</body>

</html>
